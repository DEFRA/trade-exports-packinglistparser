<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1040" viewBox="0 0 1160 1040" role="img" aria-labelledby="title desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Packing list data journey: EHCO to IDCOMS and TDS</title>
  <desc id="desc">Simplified data journey. EHCO stores the packing list and triggers PLP processing. PLP downloads, parses and validates it using cached MDM ineligible items and country codes refreshed hourly through Azure APIM. PLP then sends data along two parallel flows. Operational results: PLP publishes the processing outcome to the Trade Platform Service Bus, and Packing List Notifier updates IDCOMS through its APIs. Structured data: PLP writes parsed JSON to AWS S3, and an hourly synchronization uploads it to TDS Azure Blob Storage, deleting the S3 source after a successful transfer. PLP also looks up dispatch-location details in IDCOMS.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C9872B"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #CBD5E0; stroke-width: 1.5; }
      .process { fill: #DCE8E0; stroke: #5F8575; stroke-width: 1.5; }
      .data { fill: #E3ECFB; stroke: #5B7FBD; stroke-width: 1.5; }
      .reference { fill: #FDF6E8; stroke: #E0A83E; stroke-width: 1.5; }
      .boundary { fill: #F8FAFC; stroke: #CBD5E0; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .flow { fill: none; stroke: #4A5568; stroke-width: 1.5; marker-end: url(#arrow); }
      .line { fill: none; stroke: #4A5568; stroke-width: 1.5; }
      text { fill: #1A202C; font-size: 15px; }
      .heading { font-size: 17px; font-weight: 700; }
      .detail { font-size: 14px; fill: #5A6B82; }
      .label { font-size: 13px; fill: #4A5568; }
      .flowname { font-size: 13px; font-weight: 700; fill: #4A5568; letter-spacing: 0.5px; }
      .amber { fill: #7A6248; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1160" height="1040" fill="#FFFFFF"/>
  <text x="28" y="38" style="font-size:24px" font-weight="700">Packing list data journey</text>
  <text x="28" y="64" class="detail">EHCO through PLP | Parallel flows to IDCOMS (via Trade Platform) and TDS (via S3), with MDM reference data</text>
  <line x1="28" y1="80" x2="1132" y2="80" stroke="#E2E8F0"/>

  <!-- EHCO -->
  <rect x="290" y="110" width="500" height="116" rx="6" class="box"/>
  <text x="540" y="141" text-anchor="middle" class="heading">EHCO</text>
  <text x="540" y="168" text-anchor="middle">Export application and General Certificate</text>
  <text x="540" y="191" text-anchor="middle" class="detail">Packing List stored in EHCO Azure Blob Storage</text>
  <text x="540" y="213" text-anchor="middle" class="detail">GC Serializer adds the GC Reference to the stored file</text>
  <path d="M540,226 V318" class="flow"/>
  <text x="557" y="256" class="label">Service Bus trigger + listener calls PLP over HTTPS</text>
  <text x="557" y="277" class="label">PLP downloads the Packing List from EHCO</text>

  <!-- PLP -->
  <rect x="330" y="320" width="420" height="150" rx="6" class="process"/>
  <text x="540" y="352" text-anchor="middle" class="heading">Packing List Parser (PLP)</text>
  <text x="540" y="380" text-anchor="middle">Resolve dispatch location and select a parser</text>
  <text x="540" y="405" text-anchor="middle">Extract product lines and validate rules</text>
  <text x="540" y="431" text-anchor="middle" class="detail">Uses cached MDM reference data</text>
  <text x="540" y="453" text-anchor="middle" class="detail">Produces validation status and failure reasons</text>

  <!-- MDM -->
  <rect x="870" y="320" width="262" height="150" rx="6" class="reference"/>
  <text x="1001" y="352" text-anchor="middle" class="heading">MDM</text>
  <text x="1001" y="382" text-anchor="middle" class="amber">Ineligible items</text>
  <text x="1001" y="406" text-anchor="middle" class="amber">Country codes</text>
  <text x="1001" y="439" text-anchor="middle" class="detail amber">Reference data only</text>
  <path d="M870,395 H752" fill="none" stroke="#C9872B" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="810" y="358" text-anchor="middle" class="label amber">Hourly sync</text>
  <text x="810" y="377" text-anchor="middle" class="label amber">via Azure APIM</text>
  <text x="810" y="420" text-anchor="middle" class="label amber">Refresh cache</text>

  <!-- Split into parallel flows -->
  <path d="M540,470 V510" class="line"/>
  <path d="M540,510 H290 V604" class="flow"/>
  <path d="M540,510 H790 V604" class="flow"/>
  <text x="302" y="545" class="label">Processing outcome</text>
  <text x="802" y="545" class="label">Parsed and validated JSON</text>

  <!-- Left flow: Trade Platform to IDCOMS -->
  <text x="60" y="502" class="flowname">OPERATIONAL RESULTS</text>
  <rect x="60" y="560" width="460" height="196" rx="8" class="boundary"/>
  <text x="76" y="586" class="heading">Trade Platform</text>
  <rect x="80" y="606" width="420" height="56" rx="6" class="data"/>
  <text x="290" y="630" text-anchor="middle" class="heading">Service Bus queue</text>
  <text x="290" y="651" text-anchor="middle" class="detail">Packing List result notification</text>
  <path d="M290,662 V688" class="flow"/>
  <rect x="80" y="690" width="420" height="48" rx="6" class="box"/>
  <text x="290" y="720" text-anchor="middle" class="heading">Packing List Notifier</text>
  <path d="M290,738 V828" class="flow"/>
  <text x="302" y="792" class="label">Update IDCOMS through its APIs</text>
  <rect x="80" y="830" width="420" height="76" rx="6" fill="#15685F"/>
  <text x="290" y="861" text-anchor="middle" class="heading white">IDCOMS</text>
  <text x="290" y="887" text-anchor="middle" class="detail white">Processing status and failure reasons for users</text>

  <!-- Right flow: S3 to TDS -->
  <text x="1000" y="502" text-anchor="end" class="flowname">STRUCTURED DATA</text>
  <rect x="580" y="606" width="420" height="70" rx="6" class="data"/>
  <text x="790" y="633" text-anchor="middle" class="heading">AWS S3 (PLP)</text>
  <text x="790" y="657" text-anchor="middle" class="detail">Parsed JSON keyed by application ID</text>
  <path d="M790,676 V828" class="flow"/>
  <text x="802" y="740" class="label">Hourly TDS synchronization</text>
  <text x="802" y="761" class="label">S3 source deleted after successful transfer</text>
  <rect x="580" y="830" width="420" height="76" rx="6" fill="#15685F"/>
  <text x="790" y="861" text-anchor="middle" class="heading white">TDS</text>
  <text x="790" y="887" text-anchor="middle" class="detail white">Azure Blob Storage landing; refreshed every 24 hours</text>

  <!-- Footer -->
  <line x1="28" y1="940" x2="1132" y2="940" stroke="#E2E8F0"/>
  <text x="28" y="964" class="label">PLP also looks up dispatch-location details in IDCOMS during processing.</text>
  <text x="28" y="986" class="label">Notifications can be disabled, and unrecognised NOMATCH outcomes are not notified; all outcomes are still written to S3.</text>
  <text x="28" y="1008" class="label">API2, document URL sharing and downstream TDS consumers are omitted. Source: end-to-end-journey.md.</text>
</svg>
