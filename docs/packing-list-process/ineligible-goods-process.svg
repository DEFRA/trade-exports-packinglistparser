<svg xmlns="http://www.w3.org/2000/svg" width="760" height="930" viewBox="0 0 760 930" role="img" aria-labelledby="title desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Ineligible goods assessment</title>
  <desc id="desc">One product line. NIRMS designation and country codes assumed valid. A product line is checked for core product fields, whether it is NIRMS, matching country and commodity rules, and whether treatment rules prohibit the item.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A5568"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C9872B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="930" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="28" y="36" font-size="22" font-weight="700" fill="#1A202C">Ineligible goods assessment</text>
  <text x="28" y="58" font-size="13" fill="#6B7280">One product line &#183; NIRMS designation and country codes assumed valid</text>
  <line x1="28" y1="72" x2="732" y2="72" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Product line -->
  <rect x="300" y="96" width="180" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="390" y="123" text-anchor="middle" font-size="14" fill="#1A202C">Product line</text>
  <line x1="390" y1="140" x2="390" y2="176" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 1: core fields -->
  <polygon points="390,178 530,236 390,294 250,236" fill="#DCE8E0" stroke="#5F8575" stroke-width="1.5"/>
  <text x="390" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Core product fields</text>
  <text x="390" y="247" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">present?</text>

  <!-- No -> Incomplete data -->
  <line x1="250" y1="236" x2="234" y2="236" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="234" y="208" width="18" height="18" fill="#FFFFFF"/>
  <text x="243" y="222" text-anchor="middle" font-size="12" fill="#1A202C">No</text>
  <rect x="16" y="196" width="216" height="80" rx="6" fill="#E3ECFB" stroke="#5B7FBD" stroke-width="1.5"/>
  <text x="124" y="226" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A5F">Incomplete data</text>
  <text x="124" y="246" text-anchor="middle" font-size="11.5" fill="#5A6B82">Report missing fields or</text>
  <text x="124" y="261" text-anchor="middle" font-size="11.5" fill="#5A6B82">skip this assessment</text>

  <!-- Yes -> diamond 2 -->
  <line x1="390" y1="294" x2="390" y2="350" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="402" y="308" width="24" height="18" fill="#FFFFFF"/>
  <text x="414" y="322" text-anchor="middle" font-size="12" fill="#1A202C">Yes</text>

  <!-- Diamond 2: NIRMS item -->
  <polygon points="390,352 510,406 390,460 270,406" fill="#DCE8E0" stroke="#5F8575" stroke-width="1.5"/>
  <text x="390" y="401" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Is this a NIRMS</text>
  <text x="390" y="417" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">item?</text>

  <!-- No -> trunk -->
  <path d="M270,406 H131 V852" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="397" width="18" height="18" fill="#FFFFFF"/>
  <text x="199" y="411" text-anchor="middle" font-size="12" fill="#1A202C">No</text>

  <!-- Yes -> diamond 3 -->
  <line x1="390" y1="460" x2="390" y2="506" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="402" y="474" width="24" height="18" fill="#FFFFFF"/>
  <text x="414" y="488" text-anchor="middle" font-size="12" fill="#1A202C">Yes</text>

  <!-- Diamond 3: country/commodity -->
  <polygon points="390,508 540,572 390,636 240,572" fill="#DCE8E0" stroke="#5F8575" stroke-width="1.5"/>
  <text x="390" y="567" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Country and commodity</text>
  <text x="390" y="583" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">prefix rule matches?</text>

  <!-- No -> trunk -->
  <path d="M240,572 H131 V852" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="175" y="563" width="18" height="18" fill="#FFFFFF"/>
  <text x="184" y="577" text-anchor="middle" font-size="12" fill="#1A202C">No</text>

  <!-- Yes -> diamond 4 -->
  <line x1="390" y1="636" x2="390" y2="682" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="402" y="650" width="24" height="18" fill="#FFFFFF"/>
  <text x="414" y="664" text-anchor="middle" font-size="12" fill="#1A202C">Yes</text>

  <!-- Diamond 4: matching rules prohibit -->
  <polygon points="390,684 540,750 390,816 240,750" fill="#DCE8E0" stroke="#5F8575" stroke-width="1.5"/>
  <text x="390" y="745" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Do matching rules</text>
  <text x="390" y="761" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">prohibit this item?</text>

  <!-- No -> trunk -->
  <path d="M240,750 H131 V852" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="175" y="741" width="18" height="18" fill="#FFFFFF"/>
  <text x="184" y="755" text-anchor="middle" font-size="12" fill="#1A202C">No</text>

  <!-- Dashed connector to exception note -->
  <path d="M540,750 H600" fill="none" stroke="#C9872B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-orange)"/>

  <!-- Yes -> Prohibited item -->
  <line x1="390" y1="816" x2="390" y2="852" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="402" y="826" width="24" height="18" fill="#FFFFFF"/>
  <text x="414" y="840" text-anchor="middle" font-size="12" fill="#1A202C">Yes</text>

  <!-- Exception note box -->
  <rect x="600" y="630" width="152" height="240" rx="6" fill="#FDF6E8" stroke="#E0A83E" stroke-width="1.5"/>
  <text x="676" y="656" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6B4A1E">Exception rules are</text>
  <text x="676" y="672" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6B4A1E">checked first:</text>
  <text x="676" y="696" text-anchor="middle" font-size="11" fill="#7A6248">If matching exceptions</text>
  <text x="676" y="711" text-anchor="middle" font-size="11" fill="#7A6248">exist, allow only when</text>
  <text x="676" y="726" text-anchor="middle" font-size="11" fill="#7A6248">item treatment matches</text>
  <text x="676" y="741" text-anchor="middle" font-size="11" fill="#7A6248">the text after ! in any</text>
  <text x="676" y="756" text-anchor="middle" font-size="11" fill="#7A6248">exception; otherwise</text>
  <text x="676" y="771" text-anchor="middle" font-size="11" fill="#7A6248">prohibit.</text>
  <text x="676" y="793" text-anchor="middle" font-size="11" fill="#7A6248">If no matching exception</text>
  <text x="676" y="808" text-anchor="middle" font-size="11" fill="#7A6248">exists, a standard rule</text>
  <text x="676" y="823" text-anchor="middle" font-size="11" fill="#7A6248">prohibits when the rule or</text>
  <text x="676" y="838" text-anchor="middle" font-size="11" fill="#7A6248">item treatment is missing,</text>
  <text x="676" y="853" text-anchor="middle" font-size="11" fill="#7A6248">or the treatments match.</text>

  <!-- Bottom outcome boxes -->
  <rect x="16" y="852" width="230" height="56" rx="6" fill="#15685F"/>
  <text x="131" y="886" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">No ineligible finding</text>

  <rect x="305" y="852" width="170" height="56" rx="6" fill="#B23A3A"/>
  <text x="390" y="886" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Prohibited item</text>
</svg>
